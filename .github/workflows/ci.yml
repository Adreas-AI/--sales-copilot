name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s
          --health-timeout 3s --health-retries 20
    strategy:
      matrix:
        database: [sqlite, postgres]
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://copilot:copilot@localhost:5432/copilot' || 'sqlite://' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: Migrations apply cleanly and match the models
        if: matrix.database == 'postgres'
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        timeout-minutes: 10
        run: pytest --cov=app --cov-report=term-missing
      - name: Follow-up simulation (Day 0 to Day 10)
        if: matrix.database == 'sqlite'
        run: |
          python -m scripts.simulate_followups
          python -m scripts.simulate_followups --reply-on 3

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
