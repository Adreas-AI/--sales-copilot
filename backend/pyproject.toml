[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sales-copilot"
version = "0.1.0"
description = "AI-assisted lead qualification, personalised email drafting and follow-up automation for BookFlow's sales team."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.7",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that exercise the API, worker and database together",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008", # FastAPI's Depends() in argument defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"app/services/emails/templates.py" = ["E501"]  # long literal copy
"app/domain/catalog.py" = ["E501"]  # long literal copy
"app/services/qualification/signals.py" = ["E501"]  # regexes read better unwrapped

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.coverage.run]
source = ["app"]
